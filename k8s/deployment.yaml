apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router-pro
  namespace: llm-router-pro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-router-pro
  template:
    metadata:
      labels:
        app: llm-router-pro
    spec:
      containers:
      - name: gateway
        image: llm-router-pro:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: llm-router-secrets
              key: database-url
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router-service
spec:
  selector:
    app: llm-router-pro
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-router-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-router-pro
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
